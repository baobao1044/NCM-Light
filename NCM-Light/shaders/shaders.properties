# NCM-Light -- Ultra-Fast Linear HDR PBR + NCM Ray Tracing
#
# Ultra-lean 2-pass + final architecture for high FPS on integrated & discrete GPUs:
#   shadow -> gbuffers_* -> composite1 (1/4 res) -> composite2 (full res) -> final
#
# Bandwidth-optimised 32-bit buffer formats:
#   colortex0 (full res, R11F_G11F_B10F - 4B/px): Linear HDR lit scene
#   colortex1 (1/4 res,  RGBA16F        - 1/16x): Level-0 shafts, RTAO/skyTrans & gates
#   colortex4 (1/4 res,  R11F_G11F_B10F - 1/16x): Level-0 Linear HDR RTGI / volumetric sky
#   colortex2 (full res, RGBA8          - 4B/px): Refined shafts, trans tag & gate
#   colortex3 (full res, RGBA8          - 4B/px): Octahedral normal + light + material ID
blend.composite1 = off
blend.composite2 = off

blend.gbuffers_terrain = off
blend.gbuffers_block = off

clouds = off

size.buffer.colortex1 = 0.25 0.25
size.buffer.colortex4 = 0.25 0.25
size.buffer.colortex5 = 0.25 0.25

profile.POTATO = SHADOWS=1 shadowMapResolution=512 RT_GI=0 PT_SPP=1 PT_MULTI_BOUNCE=0 PT_GUIDING=0 RT_REFLECTIONS=1 VOLUMETRIC_CLOUDS=1 WAVING_FOLIAGE=1 COLORED_SHADOWS=0 WATER_CAUSTICS=1 LABPBR_SUPPORT=0 REFINE_THRESHOLD=0.15
profile.BALANCED = SHADOWS=1 shadowMapResolution=1024 RT_GI=1 PT_SPP=1 PT_MULTI_BOUNCE=1 PT_GUIDING=1 RT_REFLECTIONS=1 VOLUMETRIC_CLOUDS=1 WAVING_FOLIAGE=1 COLORED_SHADOWS=1 WATER_CAUSTICS=1 LABPBR_SUPPORT=1 REFINE_THRESHOLD=0.08
profile.ULTRA = SHADOWS=1 shadowMapResolution=2048 RT_GI=1 PT_SPP=2 PT_MULTI_BOUNCE=1 PT_GUIDING=1 RT_REFLECTIONS=1 RT_STRENGTH=1.25 VOLUMETRIC_CLOUDS=1 WAVING_FOLIAGE=1 COLORED_SHADOWS=1 WATER_CAUSTICS=1 LABPBR_SUPPORT=1 REFINE_THRESHOLD=0.05

screen = DEBUG_LEVEL SHADOWS RT_GI PT_SPP PT_MULTI_BOUNCE PT_GUIDING RT_REFLECTIONS VOLUMETRIC_CLOUDS WAVING_FOLIAGE COLORED_SHADOWS WATER_CAUSTICS LABPBR_SUPPORT shadowMapResolution RT_STRENGTH FOG_STRENGTH RAYS_STRENGTH DENSITY_SCALE SUN_SCATTER REFINE_THRESHOLD REFINE_SOFTNESS

sliders = RT_STRENGTH FOG_STRENGTH RAYS_STRENGTH DENSITY_SCALE SUN_SCATTER REFINE_THRESHOLD REFINE_SOFTNESS
