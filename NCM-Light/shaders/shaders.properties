# NCM-Light -- Ultra-Fast Linear HDR PBR + NCM Ray Tracing
#
# Ultra-lean 2-pass + final architecture for high FPS on integrated & discrete GPUs:
#   shadow -> gbuffers_* -> composite1 (1/4 res) -> composite2 (full res) -> final
#
# Bandwidth-optimised 32-bit buffer formats:
#   colortex0 (full res, R11F_G11F_B10F - 4B/px): Linear HDR lit scene
#   colortex1 (1/4 res,  RGBA16F        - 1/16x): Level-0 shafts, RTAO & gates
#   colortex4 (1/4 res,  R11F_G11F_B10F - 1/16x): Level-0 Linear HDR RTGI bounce
#   colortex2 (full res, RGBA8          - 4B/px): Refined shafts, trans tag & gate
#   colortex3 (full res, RGBA8          - 4B/px): Octahedral normal + light + material ID
blend.composite1 = off
blend.composite2 = off

blend.gbuffers_terrain = off
blend.gbuffers_block = off

size.buffer.colortex1 = 0.25 0.25
size.buffer.colortex4 = 0.25 0.25

screen = DEBUG_LEVEL SHADOWS RT_GI RT_REFLECTIONS <empty> RT_STRENGTH FOG_STRENGTH RAYS_STRENGTH DENSITY_SCALE SUN_SCATTER <empty> REFINE_THRESHOLD REFINE_SOFTNESS shadowMapResolution

sliders = RT_STRENGTH FOG_STRENGTH RAYS_STRENGTH DENSITY_SCALE SUN_SCATTER REFINE_THRESHOLD REFINE_SOFTNESS
